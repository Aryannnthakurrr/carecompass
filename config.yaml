# Every model name / endpoint lives here so it can be swapped without code changes.

models:
  stt:
    provider: sarvam
    model: saaras:v4             # Saarika is retired; Saaras v4 is Sarvam's current STT
    mode: transcribe             # alt: codemix (English words in Latin, Hindi in Devanagari)
    language_code: unknown       # auto-detect
  tts:
    provider: sarvam
    model: bulbul:v3             # stable; v4-flash has persona voices e.g. simran_enhi_customer
    speaker: ritu
    language_code: hi-IN
  # Chosen by eval/bench_intake.py (2026-10-24): flash-lite ~1-3s with enforced schema;
  # gemma-4-26b ~3.4s + occasional 500s; sarvam-105b ~10s, flaky; medgemma local hallucinates symptoms.
  intake:
    provider: gemini
    model: gemini-3.5-flash-lite # pinned version, not the -latest alias
    thinking_level: minimal
    fallback: gemma-4-26b-a4b-it # open-weights, same API key
  explain:
    provider: gemini
    model: gemini-3.5-flash-lite
    thinking_level: minimal
    fallback: gemma-4-26b-a4b-it
  triage:
    provider: ollama
    base_url: http://localhost:11434/v1
    model: hf.co/unsloth/medgemma-4b-it-GGUF:Q4_K_M   # baseline; replace with fine-tuned model after LoRA
  local_fallback:
    provider: ollama
    base_url: http://localhost:11434/v1
    model: hf.co/unsloth/medgemma-4b-it-GGUF:Q4_K_M   # same model as triage: no GPU swap; API backup is Sarvam-M

# Replace with organiser label strings once the taxonomy is released.
labels:
  care_types:
    - paramedic_home_visit
    - nurse
    - gp_teleconsult
    - specialist
    - emergency
  urgency:
    - routine
    - same_day
    - immediate

intake:
  max_follow_ups: 4

matching:
  weights:
    distance: 0.35
    language: 0.25
    rating: 0.20
    availability: 0.20
