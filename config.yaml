# Every model name / endpoint lives here so it can be swapped without code changes.

models:
  stt:
    provider: sarvam
    model: saaras:v4             # Saarika is retired; Saaras v4 is Sarvam's current STT
    mode: transcribe             # original words -> red-flag rules + screen
    english_mode: translate      # speech -> English for the classifier (no LLM needed; eval/results/voice.json)
    language_code: unknown       # auto-detect
  tts:
    provider: sarvam
    model: bulbul:v3             # stable; v4-flash has persona voices e.g. simran_enhi_customer
    speaker: ritu
    language_code: hi-IN
  # Chosen by eval/bench_intake.py (2026-10-24): flash-lite ~1-3s with enforced schema;
  # gemma-4-26b ~3.4s + occasional 500s; sarvam-105b ~10s, flaky; medgemma local hallucinates symptoms.
  intake:
    provider: gemini
    model: gemini-3.5-flash-lite # pinned version, not the -latest alias
    thinking_level: minimal
    fallback: gemma-4-26b-a4b-it # open-weights, same API key
  explain:
    provider: gemini
    model: gemini-3.5-flash-lite
    thinking_level: minimal
    fallback: gemma-4-26b-a4b-it
  # Provisional (eval/results/classify.json): gemma-4 29/30 care, 11/11 emergencies untrained;
  # medgemma-4b only 5/11 emergencies untrained. Final pick on organiser validation split.
  triage:
    provider: gemini
    model: gemma-4-26b-a4b-it
    thinking_level: minimal
    second_opinion: gemini-3.5-flash-lite   # optional: run in parallel, more urgent answer wins
  local_fallback:
    provider: ollama
    base_url: http://localhost:11434/v1
    model: hf.co/unsloth/medgemma-4b-it-GGUF:Q4_K_M   # offline last resort only

# Replace with organiser label strings once the taxonomy is released.
labels:
  care_types:
    - paramedic_home_visit
    - nurse
    - gp_teleconsult
    - specialist
    - emergency
  urgency:
    - routine
    - same_day
    - immediate

intake:
  max_follow_ups: 4

matching:
  weights:
    distance: 0.35
    language: 0.25
    rating: 0.20
    availability: 0.20
