# Every model name / endpoint lives here so it can be swapped without code changes.

models:
  stt:
    provider: sarvam
    model: saaras:v4             # Saarika is retired; Saaras v4 is Sarvam's current STT
    mode: transcribe             # original words -> red-flag rules + screen
    english_mode: null           # translate not needed: Qwen reads Devanagari/Hinglish directly (saves Rs0.25/conv, ~0.5 s/turn)
    language_code: unknown       # auto-detect
  tts:
    provider: sarvam
    model: bulbul:v3             # stable; v4-flash has persona voices e.g. simran_enhi_customer
    speaker: ritu
    language_code: hi-IN
  # Two-stage design, chosen by eval/bench_v2.py (2026-10-24). See docs rationale doc.
  # Structurer: user's words -> English CaseFacts JSON. Also phrases follow-ups + explanations.
  # qwen-3.8-27b: all facts 30/30, 11/11 red flags, 0 denial leaks, 0.45 s; follow-ups 17/17 script at 0.38 s.
  conversation:
    provider: cerebras
    base_url: https://api.cerebras.ai/v1
    model: qwen-3.8-27b          # open weights
    reasoning_effort: none
    fallback:
      provider: gemini
      model: gemini-3.5-flash-lite
      thinking_level: minimal
  # Classifier: CaseFacts only -> TriageDecision {status, care_type, urgency, red_flags, missing_info}.
  # MedGemma (6 examples) + Qwen, more urgent wins: 11/11 emergencies, 0 under-triaged, 0 false emergencies.
  classifier:
    provider: ollama
    base_url: http://localhost:11434/v1
    model: hf.co/unsloth/medgemma-4b-it-GGUF:Q4_K_M   # replace with LoRA fine-tune once trained (docs/medgemma-finetune.md)
    prompt: few_shot          # few_shot = rules + 7 examples (base model); rules_only = what the fine-tune was trained on
    second_opinion:
      provider: cerebras
      base_url: https://api.cerebras.ai/v1
      model: qwen-3.8-27b
    combine: more_urgent_wins

    timeout_s: 20                # MedGemma skipped (Qwen decides alone) if Ollama is down or slow
    tie_break: second_opinion    # same urgency, different care type -> Qwen until MedGemma is fine-tuned
    medgemma_vote: false         # MedGemma's 6-way vote in dataset mode: added no emergencies on held-out data and
                                 # queued behind the screener on the one GPU; MedGemma's job here is the emergency screen
    screener:                    # MedGemma emergency screen (app/screen.py): a "yes" asks to confirm first, then escalates
      enabled: true
      num_predict: 300           # danger signs + a short reason + check question
      retrieval: true            # show the 4 most similar graded training cases (app/retrieval.py)
      retrieve_k: 4

# Organiser taxonomy (training/README.md, Sanocare dataset v1).
labels:
  care_types:
    - paramedic_home_visit
    - home_nursing
    - lab_test_home
    - teleconsultation
    - emergency_112
  urgency:
    - emergency
    - same_day
    - scheduled
  red_flags:
    - chest_pain
    - breathlessness
    - unconsciousness
    - severe_bleeding
    - stroke_symptoms
    - seizure
    - high_fever_infant
    - suicidal_ideation
    - severe_dehydration
  # In all 340 organiser examples urgency is fixed by care type.
  urgency_for_care:
    emergency_112: emergency
    paramedic_home_visit: same_day
    home_nursing: same_day
    teleconsultation: same_day
    lab_test_home: scheduled

intake:
  max_follow_ups: 4
  ask_severity: true             # a symptom complaint is asked who/age, since when AND how bad (fever: how high) before routing

smart:
  providers_csv: data/providers.csv
  # The problem statement forbids diagnosing. The analyser still notes possible causes internally; keep this false
  # unless the organisers allow showing them (then they appear labelled "not a diagnosis").
  show_possible_causes: false
  medgemma_brain: false          # MedGemma's smart-mode vote queued behind its emergency screen on the one GPU (+5 s a turn);
                                 # in smart mode MedGemma's job is the screen, Qwen gives specialty and tests

matching:
  caregivers_csv: training/caregivers.csv
  top_k: 3
  proximity_km: 12             # distance normalised over 12 km (best fit to the organiser's labelled matches)
  # Organiser reference blend (training/README.md).
  weights:
    language: 0.35
    proximity: 0.30
    skill: 0.20
    rating: 0.15
  role_for_care:
    paramedic_home_visit: [medic]
    home_nursing: [medic]
    lab_test_home: [phlebotomist, medic]
    teleconsultation: [doctor]
